name: Offline discovery shortlist synthetic controls
on:
  pull_request:
    paths:
      - 'tools/discovery/offline_triage.py'
      - 'tests/test_discovery_offline_triage.py'
      - '.github/workflows/offline-discovery-triage.yml'
  workflow_dispatch:
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_discovery_offline_triage.py
      - run: python -m compileall -q tools/discovery/offline_triage.py
