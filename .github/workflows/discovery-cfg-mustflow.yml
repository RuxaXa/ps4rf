name: CFG must-object provenance prototype

on:
  pull_request:

permissions:
  contents: read

jobs:
  cfg-mustflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - name: Test CFG must reaching-definitions in isolation
        run: |
          python -m pytest -q \
            tests/test_discovery_cfg_mustflow.py \
            tests/test_discovery_cfg_mustflow_audit_capstone.py \
            tests/test_discovery_summary_placement_exact.py \
            tests/test_discovery_callee_identity_gate.py
