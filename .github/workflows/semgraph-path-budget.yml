name: Semantic entry path budget regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semgraph-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - name: Run firmware-free path and A1 regressions
        run: |
          python -m pytest -q \
            tests/test_discovery_semgraph_path_budget.py \
            tests/test_discovery_semgraph.py \
            tests/test_discovery_a1_regressions.py \
            tests/test_discovery_a1_external_repro.py
